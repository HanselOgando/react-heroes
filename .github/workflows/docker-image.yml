name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

    - name: Docker build
      run: docker buildx build --platform linux/arm64,linux/amd64 -t hanselogando/react-heroes:0.2.0 --push .

    # - name: Docker push
    #   run: docker push hanselogando/react-heroes:0.1.0


    # - name: Build the Docker image
